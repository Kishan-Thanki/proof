version: "1.0"

global:
  base_url: "https://jsonplaceholder.typicode.com"
  timeout_seconds: 5.0
  headers:
    User-Agent: "Proofrun-Synthetic-Daemon/0.1.0"
    Accept: "application/json"

scenarios:
  - name: "User Profile Check"
    interval_seconds: 60
    steps:
      - name: "Fetch User #1"
        request:
          method: "GET"
          path: "/users/1"
        expect:
          status: 200
          max_latency_ms: 1000
          headers:
            Content-Type: "application/json; charset=utf-8"
          schema:
            type: "object"
            required:
              - id
              - name
              - email
            properties:
              id:
                type: "integer"
              name:
                type: "string"
              email:
                type: "string"
        extract:
          user_id: "$.id"
          user_name: "$.name"
          user_email: "$.email"
