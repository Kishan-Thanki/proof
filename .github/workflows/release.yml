name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            pyproject.toml
            README.md
            LICENSE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  test-artifact:
    name: Test Built Artifact
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scenarios (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scenarios

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Smoke test example scenario
        run: proof run scenarios/example.yaml --once

      - name: Smoke test sample scenario
        run: proof run scenarios/sample.yaml --once

  release:
    name: Create GitHub Release
    needs: test-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

