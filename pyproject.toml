[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof"
version = "0.1.0"
description = "High-performance, memory-efficient synthetic API transaction daemon."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "uvloop>=0.19.0",
    "httpx>=0.27.0",
    "orjson>=3.9.15",
    "pydantic>=2.6.0",
    "fastjsonschema>=2.19.1",
    "jsonpath-ng>=1.6.1",
    "PyYAML>=6.0.1",
    "typer>=0.11.0",
    "rich>=13.7.0",
]

[project.scripts]
proof = "proof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/proof"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pre-commit>=4.0.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
extraPaths = [
    "src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=proof --cov-report=term-missing"

[tool.coverage.run]
source = ["src/proof"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
